name: scenario-dev

# Diagnostic branch only: build the exact Trino experiment in the existing PR-image repository.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: distinct-dictionary-image-builder
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'PostHog/duckgres' && github.ref == 'refs/heads/codex/distinct-image-builder'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: PostHog/trino
          ref: cca1d62422163f5c18c0a4c671d61a9c91340d54
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 25
      - name: Build experimental server
        run: |
          ./mvnw clean install -pl core/trino-server-posthog,client/trino-cli -am \
            -T 1C -DskipTests -Dmaven.javadoc.skip=true -Dair.check.skip-all=true
      - name: Verify changed modules
        run: |
          ./mvnw -pl lib/trino-parquet,core/trino-main test -Dtest=TestFlatColumnReader,TestGroupByHash -Dsurefire.failIfNoSpecifiedTests=false
          ./mvnw -pl lib/trino-parquet test -Dtest=TestFlatColumnReader#testPageLocalDictionaryProbe -Dtrino.parquet.dictionary-probe.enabled=true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Configure benchmark registry credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d
        with:
          role-to-assume: ${{ vars.AWS_ECR_PRS_PUBLISH_IAM_ROLE }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Log in to benchmark registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64
      - name: Publish diagnostic image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          OCI_SOURCE: https://github.com/PostHog/trino
        run: |
          set -euo pipefail
          export OCI_REVISION="$(git rev-parse HEAD)"
          echo "::add-mask::${ECR_REGISTRY}"
          image="${ECR_REGISTRY}/duckgres-prs:trino-distinct-${OCI_REVISION}"
          core/docker/build.sh -a arm64 -p trino-server-posthog -x -o "$image"
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$image" | jq -er 'select(test("^sha256:[0-9a-f]{64}$"))')"
          echo "Diagnostic image digest: ${digest}" >> "$GITHUB_STEP_SUMMARY"
