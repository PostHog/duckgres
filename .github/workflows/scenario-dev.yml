name: scenario-dev
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  image:
    uses: ./.github/workflows/_image-build.yml
    with:
      dockerfile: experiments/properties-memory/Dockerfile
      image-name: duckgres-prs
      tag: memory-probe-${{ github.run_id }}-arm64
      platform: linux/arm64
      cache-scope: properties-memory-arm64
    secrets:
      ecr-role: ${{ vars.AWS_ECR_PRS_PUBLISH_IAM_ROLE }}
  experiment:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KUBE_CONTEXT: posthog-mw-dev
      CLUSTER_NAME: posthog-mw-dev
      AWS_REGION: us-east-1
      PROBE_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.MW_DEV_ACCOUNT_ID }}:role/github-duckgres-e2e
          aws-region: us-east-1
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ vars.TS_WIF_CLIENT_ID_MW_DEV }}
          audience: ${{ vars.TS_WIF_AUDIENCE_MW_DEV }}
          tags: tag:github-runner

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION" --alias "$KUBE_CONTEXT" > /tmp/kubeconfig-setup.log 2>&1

      - name: Run isolated synthetic memory jobs
        run: python3 experiments/properties-memory/run_jobs.py
      - name: Ensure temporary namespace cleanup
        if: always()
        run: |
          kubectl delete namespace "duckgres-ci-pr-${GITHUB_RUN_ID}0" --ignore-not-found --wait=true --timeout=90s > /tmp/memory-cleanup.log 2>&1
      - name: Upload synthetic measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: properties-memory-${{ github.run_id }}
          path: memory-results/
          if-no-files-found: warn
