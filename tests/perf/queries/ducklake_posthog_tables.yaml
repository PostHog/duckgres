name: posthog-frozen-ducklake-golden-v5
description: Identical query shapes with protocol-isolated execution over frozen Parquet files registered as DuckLake tables on PGWire, Hoglake tables on Trino, and Athena external tables.
seed: 42
dataset_scale: 1
# Targeted Hoglake footer-cache run (PostHog/trino#72): Trino only, the
# queries bounded by per-split footer decoding plus one scan-bound check.
targets:
  - trino
  - trino_cached
warmup_iterations: 1
measure_iterations: 2

relation_variants:
  ducklake_table:
    events: posthog.events
    persons: posthog.persons
  hoglake_table:
    events: posthog.events
    persons: posthog.persons

paired_queries:
  - query_id_base: q_events_total_v5
    intent_id: intent_events_total_v5
    tags: [nightly, frozen, posthog, events, aggregate, paired]
    params: {}
    sql_template: SELECT COUNT(*) AS events FROM {{ relation "events" }}

  - query_id_base: q_events_count_one_day_v5
    intent_id: intent_events_count_one_day_v5
    tags: [nightly, frozen, posthog, events, aggregate, one-day, paired]
    params: {}
    sql_template: >
      SELECT COUNT(*) AS events
      FROM {{ relation "events" }}
      WHERE "timestamp" >= CAST('2026-03-01 00:00:00+00:00' AS TIMESTAMP WITH TIME ZONE)
        AND "timestamp" < CAST('2026-03-02 00:00:00+00:00' AS TIMESTAMP WITH TIME ZONE)

  - query_id_base: q_events_by_name_march_2026_v5
    intent_id: intent_events_by_name_march_2026_v5
    tags: [nightly, frozen, posthog, events, aggregate, analytics, paired]
    params: {}
    sql_template: SELECT event, COUNT(*) AS events FROM {{ relation "events" }} WHERE "timestamp" >= CAST('2026-03-01 00:00:00+00:00' AS TIMESTAMP WITH TIME ZONE) AND "timestamp" < CAST('2026-03-18 00:00:00+00:00' AS TIMESTAMP WITH TIME ZONE) GROUP BY event ORDER BY events DESC, event LIMIT 20
