name: posthog-frozen-ducklake-golden-v5
description: Identical query shapes with protocol-isolated execution over frozen Parquet files registered as DuckLake tables on PGWire, Hoglake tables on Trino, and Athena external tables.
seed: 42
dataset_scale: 1
targets:
  - trino
  - trino_cached
warmup_iterations: 1
measure_iterations: 2

# Optional per-query `expectations:` form the perf gate: per-protocol bounds on
# provider statistics (query_service_metrics.csv), checked over the measured
# iterations after the run. A broken bound, or a bounded metric that was not
# captured, fails the perf_queries step with the query, protocol, observed
# value and bound. Supported bounds:
#   max_total_splits   Trino split (driver) count; Trino targets only.
#   max_bytes_scanned  Trino physical input / Athena data scanned; a byte
#                      count or a size in KiB, MiB, GiB or TiB.
# Latency is deliberately not boundable. Bounds apply to the variant each
# protocol executes (Trino: hoglake_table).

# Targeted Trino-only run (do not merge): two Trino targets, two measured iterations.
relation_variants:
  ducklake_table:
    events: posthog.events
    persons: posthog.persons
  hoglake_table:
    events: posthog.events
    persons: posthog.persons

paired_queries:
  - query_id_base: q_events_total_v5
    intent_id: intent_events_total_v5
    tags: [nightly, frozen, posthog, events, aggregate, paired]
    params: {}
    sql_template: SELECT COUNT(*) AS events FROM {{ relation "events" }}
    # Hoglake answers this from catalog metadata: ~92 whole-file splits and no
    # data reads since PostHog/trino#77. A split per footer (thousands of
    # splits, as in PostHog/trino#67) or a data scan fails the gate.
    expectations:
      trino:
        max_total_splits: 200
        max_bytes_scanned: 10MiB
      trino_cached:
        max_total_splits: 200
        max_bytes_scanned: 10MiB

  - query_id_base: q_events_count_one_day_v5
    intent_id: intent_events_count_one_day_v5
    tags: [nightly, frozen, posthog, events, aggregate, one-day, paired]
    params: {}
    sql_template: >
      SELECT COUNT(*) AS events
      FROM {{ relation "events" }}
      WHERE "timestamp" >= CAST('2026-03-01 00:00:00+00:00' AS TIMESTAMP WITH TIME ZONE)
        AND "timestamp" < CAST('2026-03-02 00:00:00+00:00' AS TIMESTAMP WITH TIME ZONE)
    # With timestamp pruning live this reads Parquet footers only. Add
    # max_total_splits once split pruning is confirmed on the scenario lane;
    # until then the split count is recorded but not bounded.
    expectations:
      trino:
        max_bytes_scanned: 64MiB
      trino_cached:
        max_bytes_scanned: 64MiB

  - query_id_base: q_events_by_name_march_2026_v5
    intent_id: intent_events_by_name_march_2026_v5
    tags: [nightly, frozen, posthog, events, aggregate, analytics, paired]
    params: {}
    sql_template: SELECT event, COUNT(*) AS events FROM {{ relation "events" }} WHERE "timestamp" >= CAST('2026-03-01 00:00:00+00:00' AS TIMESTAMP WITH TIME ZONE) AND "timestamp" < CAST('2026-03-18 00:00:00+00:00' AS TIMESTAMP WITH TIME ZONE) GROUP BY event ORDER BY events DESC, event LIMIT 20

  - query_id_base: q_events_distinct_persons_v5
    intent_id: intent_events_distinct_persons_v5
    tags: [nightly, frozen, posthog, events, aggregate, distinct, paired]
    params: {}
    sql_template: SELECT COUNT(DISTINCT person_id) AS distinct_persons FROM {{ relation "events" }} WHERE person_id IS NOT NULL

  - query_id_base: q_persons_total_v5
    intent_id: intent_persons_total_v5
    tags: [nightly, frozen, posthog, persons, aggregate, paired]
    params: {}
    sql_template: SELECT COUNT(*) AS persons FROM {{ relation "persons" }}
    # Metadata-only like the events count: whole-file splits, far below one
    # per footer.
    expectations:
      trino:
        max_total_splits: 150
      trino_cached:
        max_total_splits: 150

  - query_id_base: q_persons_daily_april_2026_v5
    intent_id: intent_persons_daily_april_2026_v5
    tags: [nightly, frozen, posthog, persons, aggregate, time-series, paired]
    params: {}
    sql_template: SELECT date_trunc('day', _timestamp) AS day, COUNT(*) AS persons FROM {{ relation "persons" }} WHERE _timestamp >= CAST('2026-04-01 00:00:00+00:00' AS TIMESTAMP WITH TIME ZONE) AND _timestamp < CAST('2026-05-01 00:00:00+00:00' AS TIMESTAMP WITH TIME ZONE) GROUP BY 1 ORDER BY 1

  - query_id_base: q_events_daily_march_2026_v5
    intent_id: intent_events_daily_march_2026_v5
    tags: [nightly, frozen, posthog, events, aggregate, time-series, paired]
    params: {}
    sql_template: SELECT date_trunc('day', "timestamp") AS day, COUNT(*) AS events FROM {{ relation "events" }} WHERE "timestamp" >= CAST('2026-03-01 00:00:00+00:00' AS TIMESTAMP WITH TIME ZONE) AND "timestamp" < CAST('2026-03-18 00:00:00+00:00' AS TIMESTAMP WITH TIME ZONE) GROUP BY 1 ORDER BY 1
