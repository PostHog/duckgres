name: hoglake-distinct-diagnostic
description: Temporary scan and exact distinct comparison with operator profiles.
seed: 42
dataset_scale: 1
targets: [trino]
warmup_iterations: 1
measure_iterations: 1
relation_variants:
  ducklake_table:
    events: posthog.events
  hoglake_table:
    events: posthog.events
paired_queries:
  - query_id_base: distinct_baseline
    intent_id: distinct_baseline
    tags: [diagnostic]
    params: {}
    sql_template: SELECT COUNT(DISTINCT person_id) FROM {{ relation "events" }} WHERE person_id IS NOT NULL
  - query_id_base: scan_string_lengths
    intent_id: scan_string_lengths
    tags: [diagnostic]
    params: {}
    sql_template: SELECT SUM(length(person_id)) FROM {{ relation "events" }} WHERE person_id IS NOT NULL
