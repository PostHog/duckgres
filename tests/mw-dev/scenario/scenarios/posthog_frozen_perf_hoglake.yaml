name: posthog-frozen-perf-hoglake
standalone: true
run_id_prefix: scenario-frozen-perf-hoglake
required_env:
  - DUCKGRES_SCENARIO_ORG_ID
  - DUCKGRES_SCENARIO_HOGLAKE_TRINO_URL
  - DUCKGRES_SCENARIO_HOGLAKE_TRINO_CATALOG
  - DUCKGRES_SCENARIO_HOGLAKE_REFERENCE_CATALOG
  - DUCKGRES_SCENARIO_HOGLAKE_TRINO_USERNAME
  - DUCKGRES_SCENARIO_HOGLAKE_TRINO_PASSWORD
  - DUCKGRES_SCENARIO_TRINO_CA_CERT
  - DUCKGRES_SCENARIO_DATASET_VERSION
steps:
  - id: perf_queries
    type: perf_queries
    with:
      org_id: ${env:DUCKGRES_SCENARIO_ORG_ID}
      username: ${env:DUCKGRES_SCENARIO_HOGLAKE_TRINO_USERNAME}
      password: ${env:DUCKGRES_SCENARIO_HOGLAKE_TRINO_PASSWORD}
      catalog_file: ../../../perf/queries/ducklake_posthog_tables.yaml
      targets: [trino_hoglake]
      trino_server_url: ${env:DUCKGRES_SCENARIO_HOGLAKE_TRINO_URL}
      trino_catalog: ${env:DUCKGRES_SCENARIO_HOGLAKE_TRINO_CATALOG}
      trino_reference_catalog: ${env:DUCKGRES_SCENARIO_HOGLAKE_REFERENCE_CATALOG}
      trino_schema: posthog
      trino_ca_cert_file: ${env:DUCKGRES_SCENARIO_TRINO_CA_CERT}
      trino_startup_timeout: 2m
      trino_startup_poll_interval: 2s
      run_id: ${run_id}
      dataset_version: ${env:DUCKGRES_SCENARIO_DATASET_VERSION}
      fail_on_query_errors: true
