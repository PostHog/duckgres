name: posthog-frozen-perf
run_id_prefix: scenario-frozen-perf
required_env:
  - DUCKGRES_SCENARIO_ORG_ID
  - DUCKGRES_SCENARIO_HOGLAKE_URI
  - DUCKGRES_SCENARIO_FROZEN_S3_URI
  - DUCKGRES_SCENARIO_TRINO_CA_CERT
  - DUCKGRES_SCENARIO_TRINO_CATALOG_STORE_CELL_ID
  - DUCKGRES_SCENARIO_TRINO_CATALOG_STORE_DSN
  - DUCKGRES_SCENARIO_TRINO_PERF_URL
  - DUCKGRES_SCENARIO_TRINO_PERF_CELL_ID
  - DUCKGRES_SCENARIO_TRINO_CACHED_URL
  - DUCKGRES_SCENARIO_TRINO_CACHED_CELL_ID
  - DUCKGRES_SCENARIO_TRINO_ADMIN_PASSWORD_FILE
  - DUCKGRES_SCENARIO_ATHENA_REGION
  - DUCKGRES_SCENARIO_ATHENA_WORKGROUP
  - DUCKGRES_SCENARIO_ATHENA_DATABASE
  - DUCKGRES_SCENARIO_ATHENA_RESULTS_S3_URI
  - DUCKGRES_K8S_WORKER_CPU_REQUEST
  - DUCKGRES_K8S_WORKER_MEMORY_REQUEST
steps:
  - id: provision
    type: provision_warehouse
    with:
      org_id: ${env:DUCKGRES_SCENARIO_ORG_ID}
      request:
        database_name: scenario-frozen-perf-${run_id_token}
        team_id: 1
        metadata_store:
          type: cnpg-shard
        ducklake:
          enabled: true
        data_store:
          type: s3bucket
        trino:
          enabled: true
          tier: free

  - id: wait_ready
    type: wait_warehouse_ready
    with:
      org_id: ${env:DUCKGRES_SCENARIO_ORG_ID}
      timeout: 15m
      poll_interval: 10s

  - id: wait_trino_ready
    type: wait_trino_ready
    depends_on: [wait_ready]
    with:
      org_id: ${env:DUCKGRES_SCENARIO_ORG_ID}
      timeout: 15m
      poll_interval: 10s

  - id: setup_frozen_views
    type: sql
    depends_on: [wait_ready]
    with:
      org_id: ${env:DUCKGRES_SCENARIO_ORG_ID}
      catalog: ducklake
      file: ../sql/setup_frozen_views.sql
      max_attempts: 12
      retry_interval: 10s

  - id: setup_posthog_tables
    type: sql
    depends_on: [setup_frozen_views]
    with:
      org_id: ${env:DUCKGRES_SCENARIO_ORG_ID}
      catalog: ducklake
      file: ../sql/setup_posthog_tables.sql
      max_attempts: 3
      retry_interval: 10s

  - id: validate_posthog_tables
    type: sql
    depends_on: [setup_posthog_tables]
    with:
      org_id: ${env:DUCKGRES_SCENARIO_ORG_ID}
      catalog: ducklake
      file: ../sql/validate_posthog_tables.sql
      max_attempts: 3
      retry_interval: 10s

  - id: setup_hoglake
    type: setup_hoglake
    depends_on: [validate_posthog_tables]
    with:
      org_id: ${env:DUCKGRES_SCENARIO_ORG_ID}
      uri: ${env:DUCKGRES_SCENARIO_HOGLAKE_URI}
      source: ${env:DUCKGRES_SCENARIO_FROZEN_S3_URI}
      hoglake_catalog: ${env:DUCKGRES_SCENARIO_ORG_ID}-frozen
      file: ../perf/setup_hoglake.py

  - id: perf_queries
    type: perf_queries
    depends_on: [setup_hoglake, wait_trino_ready]
    with:
      org_id: ${env:DUCKGRES_SCENARIO_ORG_ID}
      catalog: ducklake
      catalog_file: ../../../perf/queries/ducklake_posthog_tables.yaml
      targets: [pgwire_uncached, pgwire_cached, trino, trino_cached, athena]
      trino_hoglake_catalog: ${env:DUCKGRES_SCENARIO_ORG_ID}-frozen
      trino_ca_cert_file: ${env:DUCKGRES_SCENARIO_TRINO_CA_CERT}
      trino_startup_timeout: 2m
      trino_startup_poll_interval: 2s
      athena_region: ${env:DUCKGRES_SCENARIO_ATHENA_REGION}
      athena_workgroup: ${env:DUCKGRES_SCENARIO_ATHENA_WORKGROUP}
      athena_catalog: AwsDataCatalog
      athena_database: ${env:DUCKGRES_SCENARIO_ATHENA_DATABASE}
      athena_output_location: ${env:DUCKGRES_SCENARIO_ATHENA_RESULTS_S3_URI}
      athena_poll_interval: 500ms
      athena_query_timeout: 30m
      run_id: ${run_id}
      dataset_version: &nightly_dataset posthog-file-views-v1
      fail_on_query_errors: true
      worker_cpu: ${env:DUCKGRES_K8S_WORKER_CPU_REQUEST}
      worker_memory: ${env:DUCKGRES_K8S_WORKER_MEMORY_REQUEST}

  - id: properties_comparison
    type: properties_comparison
    depends_on: [perf_queries]
    with:
      org_id: ${env:DUCKGRES_SCENARIO_ORG_ID}
      catalog: ducklake
      hoglake_uri: ${env:DUCKGRES_SCENARIO_HOGLAKE_URI}
      hoglake_file: ../perf/setup_hoglake.py
      targets: [pgwire_uncached, pgwire_cached, trino, trino_cached, athena]
      trino_hoglake_catalog: ${env:DUCKGRES_SCENARIO_ORG_ID}-frozen
      hoglake_catalog: ${env:DUCKGRES_SCENARIO_ORG_ID}-frozen
      trino_schema: properties_perf
      trino_ca_cert_file: ${env:DUCKGRES_SCENARIO_TRINO_CA_CERT}
      trino_startup_timeout: 2m
      trino_startup_poll_interval: 2s
      athena_region: ${env:DUCKGRES_SCENARIO_ATHENA_REGION}
      athena_workgroup: ${env:DUCKGRES_SCENARIO_ATHENA_WORKGROUP}
      athena_catalog: AwsDataCatalog
      athena_database: ${env:DUCKGRES_SCENARIO_ATHENA_DATABASE}
      athena_output_location: ${env:DUCKGRES_SCENARIO_ATHENA_RESULTS_S3_URI}
      athena_poll_interval: 500ms
      athena_query_timeout: 30m
      run_id: ${run_id}
      # Same dataset as perf_queries: both suites of one nightly publish together.
      dataset_version: *nightly_dataset
      output_subdir: perf-properties
      fail_on_query_errors: true
      worker_cpu: ${env:DUCKGRES_K8S_WORKER_CPU_REQUEST}
      worker_memory: ${env:DUCKGRES_K8S_WORKER_MEMORY_REQUEST}

  - id: validate_coverage
    type: sql
    depends_on: [perf_queries]
    with:
      org_id: ${env:DUCKGRES_SCENARIO_ORG_ID}
      catalog: ducklake
      file: ../sql/validate_posthog_coverage.sql
      max_attempts: 1

  - id: coverage_queries
    type: perf_queries
    depends_on: [validate_coverage]
    with:
      org_id: ${env:DUCKGRES_SCENARIO_ORG_ID}
      catalog: ducklake
      catalog_file: ../../../perf/queries/ducklake_posthog_coverage.yaml
      targets: [pgwire_uncached, pgwire_cached, trino, trino_cached, athena]
      trino_hoglake_catalog: ${env:DUCKGRES_SCENARIO_ORG_ID}-frozen
      trino_ca_cert_file: ${env:DUCKGRES_SCENARIO_TRINO_CA_CERT}
      trino_startup_timeout: 2m
      trino_startup_poll_interval: 2s
      athena_region: ${env:DUCKGRES_SCENARIO_ATHENA_REGION}
      athena_workgroup: ${env:DUCKGRES_SCENARIO_ATHENA_WORKGROUP}
      athena_catalog: AwsDataCatalog
      athena_database: ${env:DUCKGRES_SCENARIO_ATHENA_DATABASE}
      athena_output_location: ${env:DUCKGRES_SCENARIO_ATHENA_RESULTS_S3_URI}
      athena_poll_interval: 500ms
      athena_query_timeout: 30m
      run_id: ${run_id}-coverage
      nightly_run_id: ${run_id}
      output_subdir: perf-coverage
      suite: coverage
      dataset_version: *nightly_dataset
      fail_on_query_errors: true
      worker_cpu: ${env:DUCKGRES_K8S_WORKER_CPU_REQUEST}
      worker_memory: ${env:DUCKGRES_K8S_WORKER_MEMORY_REQUEST}

# Managed Hoglake retains tenant ownership and rejects public deprovision.
# The workflow's always-run isolated-stack teardown owns cleanup of the
# Duckling, namespace, metadata store and dedicated managed storage prefix.
